services:
  - type: web
    name: ekip-rag-platform
    env: docker
    plan: free
    region: ohio
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIM
        value: "384"
      - key: RERANKER_PROVIDER
        value: fastembed
      - key: RERANKER_MODEL
        value: BAAI/bge-reranker-base
      - key: SEMANTIC_CACHE_PROVIDER
        value: redis
      - key: ENABLE_SEMANTIC_CACHE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
